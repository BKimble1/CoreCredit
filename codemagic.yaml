workflows:
  corecredit-simulator-build:
    name: CoreCredit Simulator Build
    max_build_duration: 60

    environment:
      xcode: 26.4

    scripts:
      - name: Verify Xcode project
        script: |
          xcodebuild -version
          xcodebuild -list \
            -project CoreCredit.xcodeproj

      # Building the CoreCredit scheme also builds CoreCreditQuickScanWidget: the app target
      # depends on the widget and embeds the .appex, so a widget compile error fails this step.
      - name: Build CoreCredit and the widget extension for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild clean build \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/xcodebuild.log"

      # A concrete simulator is required here. `generic/platform=iOS Simulator` is a build-only
      # destination and cannot run a test bundle. Unit tests only: the UI tests drive a full
      # simulator session and belong in a longer job.
      - name: Run the unit test suite
        script: |
          set -o pipefail

          xcodebuild test \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -only-testing:CoreCreditTests \
            -resultBundlePath "$CM_BUILD_DIR/CoreCreditTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/xcodebuild-tests.log"

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/CoreCredit.app
      - $CM_BUILD_DIR/xcodebuild.log
      - $CM_BUILD_DIR/xcodebuild-tests.log
      - $CM_BUILD_DIR/CoreCreditTests.xcresult

  # Signed build for internal TestFlight testing. No credentials are stored here:
  # App Store Connect auth comes from the Codemagic "CoreCredit App Store"
  # integration, whose signing key lives in Codemagic and never in this repository.
  corecredit-testflight:
    name: CoreCredit TestFlight
    max_build_duration: 60

    integrations:
      app_store_connect: "CoreCredit App Store"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: 26.4
      # Codemagic fetches profiles for this bundle identifier and for bundle identifiers that
      # extend it, which covers the widget extension `com.blakekimble.corecredit.widget`.
      # If the widget ever fails to sign, delete the `bundle_identifier` line: with it omitted
      # Codemagic provisions every target found in the project.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blakekimble.corecredit
      vars:
        APP_STORE_APPLE_ID: "6802336957"

    scripts:
      - name: Verify Xcode project
        script: |
          set -e
          xcodebuild -version
          xcodebuild -list \
            -project "$CM_BUILD_DIR/CoreCredit.xcodeproj"

      - name: Apply App Store signing
        script: |
          set -e
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Set unique build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CoreCredit.xcodeproj" \
            --scheme CoreCredit

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
