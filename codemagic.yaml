workflows:
  corecredit-simulator-build:
    name: CoreCredit Simulator Build
    max_build_duration: 60

    environment:
      xcode: 26.4

    scripts:
      - name: Verify Xcode project
        script: |
          xcodebuild -version
          xcodebuild -list \
            -project CoreCredit.xcodeproj

      # Building the CoreCredit scheme also builds CoreCreditQuickScanWidget: the app target
      # depends on the widget and embeds the .appex, so a widget compile error fails this step.
      - name: Build CoreCredit and the widget extension for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild clean build \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/xcodebuild.log"

      # A concrete simulator is required here: `generic/platform=iOS Simulator` is a build-only
      # destination and cannot run a test bundle. The device is *discovered* rather than named,
      # because the runner's simulator set changes with every Xcode image — hard-coding a model
      # fails the day that model is dropped. Any iPhone will do; these are unit tests with no
      # device-specific behaviour. Unit tests only: the UI tests drive a full simulator session
      # and belong in a longer job.
      - name: Run the unit test suite
        script: |
          set -o pipefail

          # Last available iPhone in the list, which is the newest installed runtime.
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone" \
            | tail -n 1 \
            | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running unit tests on simulator $DEVICE_ID"
          xcrun simctl list devices available | grep -E "^ +iPhone" | tail -n 1

          LOG="$CM_BUILD_DIR/xcodebuild-tests.log"
          STATUS=0

          xcodebuild test \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:CoreCreditTests \
            -resultBundlePath "$CM_BUILD_DIR/CoreCreditTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$LOG" || STATUS=$?

          # Reprint every failure at the very end.
          #
          # The log runs to tens of thousands of lines and the CI view shows only its tail, which
          # is whichever tests happened to finish last — usually passes. Without this, a red build
          # says "3 issues" and hides all three. Swift Testing marks them with U+2718 and XCTest
          # with "error:", so both are collected.
          echo ""
          echo "================= TEST FAILURE SUMMARY ================="
          # Match on ASCII markers, not on the U+2718 glyph: macOS ships bash 3.2, which does
          # not understand $'\uXXXX' escapes. Swift Testing always writes "recorded an issue"
          # alongside the glyph, so that string is both portable and precise.
          #
          # A bare "error:" is NOT usable here. CoreData logs hundreds of "CoreData: error:"
          # filesystem diagnostics on a perfectly healthy run, and they crowd out the results.
          echo "--- Recorded test issues ---"
          grep -a "recorded an issue" "$LOG" | head -n 60 || echo "(none)"

          echo "--- Build errors ---"
          grep -aE '\.swift:[0-9]+(:[0-9]+)?: error:' "$LOG" | head -n 40 || echo "(none)"

          echo "--- Run summary ---"
          grep -a "Test run with" "$LOG" | tail -n 5 || echo "(none)"
          echo "==============================================="
          echo "xcodebuild exit status: $STATUS"
          exit $STATUS

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/CoreCredit.app
      - $CM_BUILD_DIR/xcodebuild.log
      - $CM_BUILD_DIR/xcodebuild-tests.log
      - $CM_BUILD_DIR/CoreCreditTests.xcresult

  # Signed build for internal TestFlight testing. No credentials are stored here:
  # App Store Connect auth comes from the Codemagic "CoreCredit App Store"
  # integration, whose signing key lives in Codemagic and never in this repository.
  corecredit-testflight:
    name: CoreCredit TestFlight
    max_build_duration: 60

    integrations:
      app_store_connect: "CoreCredit App Store"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: 26.4
      # Codemagic's managed signing. This is the only path here that carries a certificate
      # *private key*: fetching signing files by hand fails with "Cannot save Signing
      # Certificates without certificate private key", because that key lives in Codemagic and
      # never in this repository.
      #
      # `bundle_identifier` is required whenever `distribution_type` is set, and only one may be
      # given. Matching is by prefix rather than exact, so once a provisioning profile exists for
      # `com.blakekimble.corecredit.widget` this picks it up for the embedded extension too.
      #
      # ONE-TIME OWNER ACTION: the widget's App ID and provisioning profile have to exist in the
      # Developer portal. Managed signing creates them for the identifier named below, but not
      # for the extension's. docs/HANDOFF.md has the exact steps.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blakekimble.corecredit
      vars:
        APP_STORE_APPLE_ID: "6802336957"

    scripts:
      - name: Verify Xcode project
        script: |
          set -e
          xcodebuild -version
          xcodebuild -list \
            -project "$CM_BUILD_DIR/CoreCredit.xcodeproj"

      - name: Apply App Store signing
        script: |
          set -e
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

          # Report what was actually installed.
          #
          # The archive error only ever says a target "requires a provisioning profile". It never
          # says which profiles exist, so "the widget's profile was never created" and "the
          # configuration is wrong" look identical. This makes the difference visible.
          echo ""
          echo "=========== INSTALLED PROVISIONING PROFILES ==========="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if ls "$PROFILE_DIR"/*.mobileprovision >/dev/null 2>&1; then
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              plist=$(security cms -D -i "$profile" 2>/dev/null || echo "")
              name=$(printf '%s' "$plist" | plutil -extract Name raw - 2>/dev/null || echo "?")
              appid=$(printf '%s' "$plist" \
                | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "?")
              echo "  $appid    ($name)"
            done
          else
            echo "  none installed"
          fi
          echo ""
          echo "  The archive has to sign both of these:"
          echo "    com.blakekimble.corecredit"
          echo "    com.blakekimble.corecredit.widget"
          echo "  Each needs a profile listed above, prefixed with the team id 7GNFT94A9L."
          echo "  A missing widget line means its App ID and profile do not exist yet —"
          echo "  see docs/HANDOFF.md section 2, item 0."
          echo "======================================================="

      - name: Set unique build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CoreCredit.xcodeproj" \
            --scheme CoreCredit

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
