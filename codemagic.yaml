workflows:
  corecredit-simulator-build:
    name: CoreCredit Simulator Build and Test
    # Raised from 60: this workflow now runs the UI suite as well, which drives a full simulator
    # session per test rather than executing pure functions.
    max_build_duration: 120

    # A gate has to actually run to be a gate. Before this block existed the workflow had no
    # trigger at all, so it only ever ran when somebody remembered to press the button — which is
    # how a UI suite reaches release day having never executed once. Every branch and every pull
    # request builds and tests now. Nothing here signs or publishes anything.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: 26.4

    scripts:
      # Runs first because it costs two seconds and catches the class of mistake that would
      # otherwise be found twenty minutes later by a failing UI test, or not at all: a drifted
      # accessibility identifier, a non-additive SwiftData change, a placeholder support URL, a
      # launch screen quietly disabled, a legal page edited by hand instead of regenerated.
      - name: Verify repository invariants
        script: |
          python3 scripts/verify_repository.py

      - name: Verify Xcode project
        script: |
          xcodebuild -version
          xcodebuild -list \
            -project CoreCredit.xcodeproj

      # Building the CoreCredit scheme also builds CoreCreditQuickScanWidget: the app target
      # depends on the widget and embeds the .appex, so a widget compile error fails this step.
      - name: Build CoreCredit and the widget extension for iOS Simulator
        script: |
          set -o pipefail

          xcodebuild clean build \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/xcodebuild.log"

      # A concrete simulator is required here: `generic/platform=iOS Simulator` is a build-only
      # destination and cannot run a test bundle. The device is *discovered* rather than named,
      # because the runner's simulator set changes with every Xcode image — hard-coding a model
      # fails the day that model is dropped. Any iPhone will do; these are unit tests with no
      # device-specific behaviour.
      - name: Run the unit test suite
        script: |
          set -o pipefail

          # Last available iPhone in the list, which is the newest installed runtime.
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone" \
            | tail -n 1 \
            | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running unit tests on simulator $DEVICE_ID"
          xcrun simctl list devices available | grep -E "^ +iPhone" | tail -n 1

          LOG="$CM_BUILD_DIR/xcodebuild-tests.log"
          STATUS=0

          xcodebuild test \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:CoreCreditTests \
            -resultBundlePath "$CM_BUILD_DIR/CoreCreditTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$LOG" || STATUS=$?

          # Reprint every failure at the very end.
          #
          # The log runs to tens of thousands of lines and the CI view shows only its tail, which
          # is whichever tests happened to finish last — usually passes. Without this, a red build
          # says "3 issues" and hides all three. Swift Testing marks them with U+2718 and XCTest
          # with "error:", so both are collected.
          echo ""
          echo "================= TEST FAILURE SUMMARY ================="
          # Match on ASCII markers, not on the U+2718 glyph: macOS ships bash 3.2, which does
          # not understand $'\uXXXX' escapes. Swift Testing always writes "recorded an issue"
          # alongside the glyph, so that string is both portable and precise.
          #
          # A bare "error:" is NOT usable here. CoreData logs hundreds of "CoreData: error:"
          # filesystem diagnostics on a perfectly healthy run, and they crowd out the results.
          echo "--- Recorded test issues ---"
          grep -a "recorded an issue" "$LOG" | head -n 60 || echo "(none)"

          echo "--- Failing test cases, for any XCTest case in this bundle ---"
          grep -aE "^Test Case .* failed" "$LOG" | head -n 40 || echo "(none)"

          echo "--- Build errors ---"
          grep -aE '\.swift:[0-9]+(:[0-9]+)?: error:' "$LOG" | head -n 40 || echo "(none)"

          echo "--- Run summary ---"
          grep -aE "Executed [0-9]+ test|Test run with" "$LOG" | tail -n 5 || echo "(none)"
          echo "==============================================="
          echo "xcodebuild exit status: $STATUS"
          exit $STATUS

      # The UI suite. It used to be excluded from every workflow, which meant seven files of
      # assertions written against real accessibility identifiers had never been evaluated even
      # once — "compiled but never executed". This step is what stops that recurring.
      #
      # It is a separate step rather than a second `-only-testing` on the one above so that a UI
      # failure is distinguishable from a unit failure in the log at a glance, and so the unit
      # suite's result bundle survives even when the UI run dies.
      #
      # Every UI test launches with `-uiTesting`, so the store is in memory, the subscription
      # engine is a stub, the notification scheduler is a recorder, and animations are off. No test
      # touches the camera, live StoreKit, or a real notification.
      - name: Run the UI test suite
        script: |
          set -o pipefail

          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone" \
            | tail -n 1 \
            | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running UI tests on simulator $DEVICE_ID"

          LOG="$CM_BUILD_DIR/xcodebuild-uitests.log"
          STATUS=0

          xcodebuild test \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:CoreCreditUITests \
            -resultBundlePath "$CM_BUILD_DIR/CoreCreditUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$LOG" || STATUS=$?

          echo ""
          echo "=============== UI TEST FAILURE SUMMARY ==============="

          # The definitive list, and the first thing to read.
          #
          # Every class here sets `continueAfterFailure = false`, so one failing test records
          # exactly one failure — which means this list and the "with N failures" total below must
          # agree. When they did not, the difference was tests that *threw* rather than asserted:
          # `try requireDeepControl(...)` and `try XCTUnwrap(...)` report `threw error`, which the
          # old "error: ... failed" pattern could not match. Two failures went unnamed for two
          # whole cycles because of it.
          echo "--- Failing test cases (one line per failing test) ---"
          grep -aE "^Test Case .* failed" "$LOG" | head -n 60 || echo "(none)"

          echo "--- Failure detail (asserted and thrown alike) ---"
          grep -aE "error: -\[" "$LOG" | head -n 60 || echo "(none)"

          echo "--- Recorded test issues ---"
          grep -a "recorded an issue" "$LOG" | head -n 60 || echo "(none)"
          echo "--- Timed-out waits (the usual shape of a UI failure here) ---"
          grep -a "Timed out after" "$LOG" | head -n 30 || echo "(none)"
          echo "--- Run summary ---"
          grep -aE "Executed [0-9]+ test" "$LOG" | tail -n 5 || echo "(none)"
          echo "======================================================"
          echo "xcodebuild exit status: $STATUS"

          # Not tolerated. A failing UI test is a broken product or a broken test, and the brief
          # for this app forbids weakening, skipping, or quarantining one to get a green build.
          exit $STATUS

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/CoreCredit.app
      - $CM_BUILD_DIR/xcodebuild.log
      - $CM_BUILD_DIR/xcodebuild-tests.log
      - $CM_BUILD_DIR/xcodebuild-uitests.log
      - $CM_BUILD_DIR/CoreCreditTests.xcresult
      - $CM_BUILD_DIR/CoreCreditUITests.xcresult

  # Signed build for internal TestFlight testing. No credentials are stored here:
  # App Store Connect auth comes from the Codemagic "CoreCredit App Store"
  # integration, whose signing key lives in Codemagic and never in this repository.
  corecredit-testflight:
    name: CoreCredit TestFlight (manual — publishes)
    max_build_duration: 60

    integrations:
      app_store_connect: "CoreCredit App Store"

    # DELIBERATELY NO `triggering:` SECTION — this workflow is started by hand.
    #
    # It used to trigger on every push to `main`, which made *merging* a release action: any
    # commit landing on the shipping branch — a documentation fix, an audit, a typo — uploaded a
    # new build to TestFlight as a side effect. That is the wrong default for the one workflow in
    # this file that publishes to App Store Connect. Testers would receive builds nobody decided
    # to cut, and the build number would advance for changes that were never meant to ship.
    #
    # Publishing is now an explicit decision: open Codemagic and start this workflow. Everything
    # that *gates* quality still runs automatically on every push and pull request — see
    # `corecredit-simulator-build` above, which builds the app and the widget and runs both test
    # suites. `corecredit-release-archive` below proves the signed Release archive without
    # uploading anything.
    #
    # OWNER CHECK, ONCE: codemagic.yaml is not the only place a trigger can live. Confirm in the
    # Codemagic UI (Applications -> CoreCredit -> this workflow) that no automatic build trigger
    # is configured there either, or the removal below is cosmetic. See docs/RELEASE.md.

    environment:
      xcode: 26.4
      # Codemagic's managed signing. This is the only path here that carries a certificate
      # *private key*: fetching signing files by hand fails with "Cannot save Signing
      # Certificates without certificate private key", because that key lives in Codemagic and
      # never in this repository.
      #
      # `bundle_identifier` is required whenever `distribution_type` is set, and only one may be
      # given. Matching is by prefix rather than exact, so once a provisioning profile exists for
      # `com.blakekimble.corecredit.widget` this picks it up for the embedded extension too.
      #
      # ONE-TIME OWNER ACTION: the widget's App ID and provisioning profile have to exist in the
      # Developer portal. Managed signing creates them for the identifier named below, but not
      # for the extension's. docs/HANDOFF.md has the exact steps.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blakekimble.corecredit
      vars:
        APP_STORE_APPLE_ID: "6802336957"

    scripts:
      # The same gate as the test workflow. A signed build that ships a placeholder support URL is
      # an App Review rejection, and this is the cheapest possible place to catch one.
      - name: Verify repository invariants
        script: |
          set -e
          python3 scripts/verify_repository.py

      - name: Verify Xcode project
        script: |
          set -e
          xcodebuild -version
          xcodebuild -list \
            -project "$CM_BUILD_DIR/CoreCredit.xcodeproj"

      # `ios_signing` above fetches the profile for the one identifier it names, and nothing else,
      # so the embedded widget extension's profile never reaches the runner even once it exists in
      # the portal. Fetch that one here.
      #
      # This runs *after* managed signing, which matters. Run first, against an empty keychain, it
      # fails with "Cannot save Signing Certificates without certificate private key" — that key
      # belongs to Codemagic and is only placed in the keychain by managed signing. By this point
      # it is already there.
      #
      # Deliberately non-fatal: if it cannot fetch, the profile listing in the next step is the
      # evidence that says so, and a hard failure here would hide it.
      - name: Fetch the widget extension's provisioning profile
        script: |
          set +e
          app-store-connect fetch-signing-files "com.blakekimble.corecredit.widget" \
            --type IOS_APP_STORE \
            --create
          echo "fetch-signing-files exit status: $?"
          exit 0

      - name: Apply App Store signing
        script: |
          set -e
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

          # Report what was actually installed.
          #
          # The archive error only ever says a target "requires a provisioning profile". It never
          # says which profiles exist, so "the widget's profile was never created" and "the
          # configuration is wrong" look identical. This makes the difference visible.
          echo ""
          echo "=========== INSTALLED PROVISIONING PROFILES ==========="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if ls "$PROFILE_DIR"/*.mobileprovision >/dev/null 2>&1; then
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              plist=$(security cms -D -i "$profile" 2>/dev/null || echo "")
              name=$(printf '%s' "$plist" | plutil -extract Name raw - 2>/dev/null || echo "?")
              appid=$(printf '%s' "$plist" \
                | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "?")
              echo "  $appid    ($name)"
            done
          else
            echo "  none installed"
          fi
          echo ""
          echo "  The archive has to sign both of these:"
          echo "    com.blakekimble.corecredit"
          echo "    com.blakekimble.corecredit.widget"
          echo "  Each needs a profile listed above, prefixed with the team id 7GNFT94A9L."
          echo "  A missing widget line means its App ID and profile do not exist yet —"
          echo "  see docs/HANDOFF.md section 2, item 0."
          echo "======================================================="

      - name: Set unique build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CoreCredit.xcodeproj" \
            --scheme CoreCredit

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration

  # ---------------------------------------------------------------------------------------------
  # The archive/signing gate. Signs exactly what TestFlight would sign, and uploads nothing.
  #
  # This exists because the two questions "does the Release configuration archive and sign?" and
  # "should testers get a new build?" used to have one answer. Separating them means the expensive,
  # failure-prone half — Release compilation, managed signing, the widget extension's own profile,
  # export options — can be proven on demand without spending a TestFlight build number or sending
  # testers something nobody decided to release.
  #
  # Identical to `corecredit-testflight` except that it has no `publishing:` section, and that it
  # inspects the .ipa it produced. Manual start only, same as that workflow.
  # ---------------------------------------------------------------------------------------------
  corecredit-release-archive:
    name: CoreCredit Signed Release Archive (manual — publishes nothing)
    max_build_duration: 60

    integrations:
      app_store_connect: "CoreCredit App Store"

    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blakekimble.corecredit

    scripts:
      - name: Verify repository invariants
        script: |
          set -e
          python3 scripts/verify_repository.py

      - name: Verify Xcode project
        script: |
          set -e
          xcodebuild -version
          xcodebuild -list -project "$CM_BUILD_DIR/CoreCredit.xcodeproj"

      # The app and the widget must both compile under the configuration that actually ships.
      # `corecredit-simulator-build` only ever builds Debug, so a Release-only failure — a
      # whole-module-optimisation diagnostic, an `#if DEBUG` that was holding something together —
      # would otherwise be found for the first time by the archive step below, or by App Review.
      - name: Build Release configuration for the simulator
        script: |
          set -o pipefail
          set -e
          xcodebuild clean build \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$CM_BUILD_DIR/xcodebuild-release.log"

      - name: Fetch the widget extension's provisioning profile
        script: |
          set +e
          app-store-connect fetch-signing-files "com.blakekimble.corecredit.widget" \
            --type IOS_APP_STORE \
            --create
          echo "fetch-signing-files exit status: $?"
          exit 0

      - name: Apply App Store signing
        script: |
          set -e
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

          echo ""
          echo "=========== INSTALLED PROVISIONING PROFILES ==========="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if ls "$PROFILE_DIR"/*.mobileprovision >/dev/null 2>&1; then
            for profile in "$PROFILE_DIR"/*.mobileprovision; do
              plist=$(security cms -D -i "$profile" 2>/dev/null || echo "")
              name=$(printf '%s' "$plist" | plutil -extract Name raw - 2>/dev/null || echo "?")
              appid=$(printf '%s' "$plist" \
                | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "?")
              echo "  $appid    ($name)"
            done
          else
            echo "  none installed"
          fi
          echo "  Both of these must appear above, prefixed with team id 7GNFT94A9L:"
          echo "    com.blakekimble.corecredit"
          echo "    com.blakekimble.corecredit.widget"
          echo "======================================================="

      # No `agvtool new-version` here on purpose. A build number is a release artefact; burning one
      # to answer "does it sign?" makes the next real TestFlight build's number misleading.
      - name: Build signed IPA (not uploaded)
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/CoreCredit.xcodeproj" \
            --scheme CoreCredit

      # The evidence the release gate actually wants: what is inside the thing that would ship.
      - name: Inspect the signed archive
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Inspecting $IPA"

          WORK="$CM_BUILD_DIR/ipa-inspect"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -n 1)

          echo ""
          echo "=============== APP BUNDLE ==============="
          plutil -p "$APP/Info.plist" | grep -E \
            'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleDisplayName|MinimumOSVersion|ITSAppUsesNonExemptEncryption|NSCameraUsageDescription|UILaunchScreen' \
            || true

          echo ""
          echo "--- Privacy manifest present? ---"
          test -f "$APP/PrivacyInfo.xcprivacy" \
            && echo "  yes: $APP/PrivacyInfo.xcprivacy" \
            || { echo "  NO — the privacy manifest did not make it into the bundle"; exit 1; }

          echo ""
          echo "--- App icon present in the asset catalog? ---"
          if [ -f "$APP/Assets.car" ]; then
            echo "  Assets.car present"
            xcrun assetutil --info "$APP/Assets.car" 2>/dev/null \
              | grep -iE '"Name".*AppIcon|AppIcon' | head -n 5 || echo "  (assetutil listed no AppIcon rows)"
          else
            echo "  NO Assets.car"; exit 1
          fi

          echo ""
          echo "--- Embedded extensions ---"
          ls "$APP/PlugIns" 2>/dev/null || echo "  none"
          WIDGET="$APP/PlugIns/CoreCreditQuickScanWidget.appex"
          test -d "$WIDGET" \
            && plutil -p "$WIDGET/Info.plist" \
                 | grep -E 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString|NSExtensionPointIdentifier' \
            || { echo "  WIDGET MISSING — the .appex was not embedded"; exit 1; }

          echo ""
          echo "--- A .storekit configuration must NOT be in the bundle ---"
          if find "$APP" -name '*.storekit' | grep -q .; then
            echo "  FOUND a .storekit file inside the shipping bundle:"
            find "$APP" -name '*.storekit'
            exit 1
          fi
          echo "  none — correct"

          echo ""
          echo "--- Code signature and entitlements ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed 's/^/  /'
          echo ""
          codesign -d --entitlements :- "$APP" 2>/dev/null | sed 's/^/  /' || true
          echo ""
          codesign -dv --verbose=2 "$WIDGET" 2>&1 | sed 's/^/  /'
          echo "=========================================="

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/xcodebuild-release.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # NO `publishing:` SECTION. That absence is the entire point of this workflow.

  # ---------------------------------------------------------------------------------------------
  # TEMPORARY — DELETE BEFORE MERGING TO main.
  #
  # A fast signal on exactly the tests under repair, so a two-minute question is not answered by a
  # sixteen-minute run. It builds and signs nothing and publishes nothing.
  #
  # It carries a `triggering:` block scoped to the single repair branch, which is deliberate on two
  # counts. Codemagic lists a branch's workflows by trigger applicability, so a workflow with no
  # trigger at all cannot be picked from the UI for that branch — which is exactly what happened
  # with the two manual workflows above. And because the pattern names one branch that will be
  # deleted after the merge, this can never fire on main, on a release branch, or on anything else.
  #
  # The invariant in scripts/verify_repository.py still holds: this workflow has no `publishing:`
  # section, so triggering automatically costs nothing but simulator minutes.
  # ---------------------------------------------------------------------------------------------
  corecredit-targeted-ui:
    name: CoreCredit Targeted UI Tests (manual)
    max_build_duration: 45

    # Deliberately no `triggering:` block any more. This workflow existed to iterate on two
    # failing tests without paying for the full suite each time; both are green, so the full gate
    # is back in charge of this branch and there is no reason for a second run to fire beside it.
    # Started by hand if it is ever wanted again; removed altogether after submission.

    environment:
      xcode: 26.4

    scripts:
      - name: Verify repository invariants
        script: |
          set -e
          python3 scripts/verify_repository.py

      # The same simulator discovery the full workflow uses: the runner's device set changes with
      # every Xcode image, so the newest installed iPhone is found rather than named.
      - name: Run only the two tests under repair
        script: |
          set -o pipefail

          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone" \
            | tail -n 1 \
            | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running the targeted UI tests on simulator $DEVICE_ID"

          LOG="$CM_BUILD_DIR/xcodebuild-targeted.log"
          STATUS=0

          xcodebuild test \
            -project CoreCredit.xcodeproj \
            -scheme CoreCredit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -resultBundlePath "$CM_BUILD_DIR/CoreCreditTargetedUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:CoreCreditUITests/CoreWorkflowUITests/testCoreTravelsFromVendorCreationToZeroMoneyAtRisk \
            -only-testing:CoreCreditUITests/CoreWorkflowUITests/testShortCreditOpensADisputeForTheShortfall \
            | tee "$LOG" || STATUS=$?

          echo ""
          echo "============ TARGETED UI TEST SUMMARY ============"
          echo "--- Failing test cases (one line per failing test) ---"
          grep -aE "^Test Case .* failed" "$LOG" | head -n 20 || echo "(none)"
          echo "--- Failure detail (asserted and thrown alike) ---"
          grep -aE "error: -\[" "$LOG" | head -n 40 || echo "(none)"
          echo "--- Timed-out waits ---"
          grep -a "Timed out after" "$LOG" | head -n 20 || echo "(none)"
          echo "--- Run summary (expect: Executed 2 tests, with 0 failures) ---"
          grep -aE "Executed [0-9]+ test" "$LOG" | tail -n 3 || echo "(none)"
          echo "================================================="
          echo "xcodebuild exit status: $STATUS"
          exit $STATUS

    artifacts:
      - $CM_BUILD_DIR/xcodebuild-targeted.log
      - $CM_BUILD_DIR/CoreCreditTargetedUITests.xcresult
